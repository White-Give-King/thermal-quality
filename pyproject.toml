[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-focus-quality"
version = "0.1.0"
description = "Image-level focus-quality classification for pseudo-color thermal images"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4",
  "opencv-python==4.10.0.84",
  "scikit-learn==1.5.2",
  "PyYAML==6.0.2",
  "pandas==2.2.3",
]

[project.optional-dependencies]
models = ["torch==2.7.1", "torchvision==0.22.1"]
ui = ["gradio==6.30.0"]
test = ["pytest==8.3.4", "httpx==0.27.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
