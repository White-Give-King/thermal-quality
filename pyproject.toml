[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-focus-quality"
version = "0.1.0"
description = "Image-level focus-quality classification for pseudo-color thermal images"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.4",
  "opencv-python==5.0.0.93",
  "scikit-learn==1.9.1",
  "PyYAML==6.0.3",
  "pandas==3.1.1",
]

[project.optional-dependencies]
models = ["torch==2.14.1", "torchvision==0.29.1"]
ui = ["gradio==6.31.0"]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.setuptools]
py-modules = [
  "annotation_storage",
  "classifier",
  "dataset",
  "decision",
  "evaluation",
  "image_io",
  "inference",
  "thermal_roi",
  "visualization",
  "webui_service",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["webui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
