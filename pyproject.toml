[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-focus-quality"
version = "0.1.0"
description = "Image-level focus-quality classification for pseudo-color thermal images"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "opencv-python==4.14.0.94",
  "scikit-learn==1.9.1",
  "PyYAML==6.0.3",
  "pandas==3.1.0",
]

[project.optional-dependencies]
models = ["torch==2.11.0", "torchvision==0.26.0"]
ui = ["gradio==6.30.0"]
test = ["pytest==9.2.0", "httpx==0.27.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
